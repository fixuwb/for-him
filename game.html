<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лови сердечки</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #ffe6f0;
    text-align: center;
    padding: 20px;
    margin: 0;
  }
  h1 { color: #d6336c; }
  #area {
    position: relative;
    width: 600px;
    height: 500px;
    max-width: 95vw;
    margin: 20px auto;
    background: white;
    border: 3px solid #d6336c;
    border-radius: 15px;
    overflow: hidden;
  }
  .heart {
    position: absolute;
    font-size: 55px;
    cursor: pointer;
    user-select: none;
    line-height: 1;
  }
  #score {
    font-size: 22px;
    color: #d6336c;
    font-weight: bold;
    margin: 15px;
  }
  button {
    padding: 14px 30px;
    font-size: 18px;
    background: #d6336c;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>
  <h1>Лови сердечки</h1>
  <button id="btn" onclick="startGame()">Начать игру</button>
  <div id="score">Счёт: 0</div>
  <div id="area"></div>

<script>
  var score = 0;
  var running = false;
  var spawnTimer = null;
  var timeTimer = null;
  var timeLeft = 15;

  function startGame() {
    score = 0;
    timeLeft = 15;
    running = true;

    document.getElementById("score").innerText = "Счёт: 0 | Осталось: 15 сек";
    document.getElementById("btn").disabled = true;
    document.getElementById("btn").innerText = "Игра идёт...";
    document.getElementById("area").innerHTML = "";

    if (spawnTimer) clearInterval(spawnTimer);
    if (timeTimer) clearInterval(timeTimer);

    spawnTimer = setInterval(function() {
      if (running) spawnHeart();
    }, 500);

    timeTimer = setInterval(function() {
      timeLeft = timeLeft - 1;
      document.getElementById("score").innerText =
        "Счёт: " + score + " | Осталось: " + timeLeft + " сек";
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function spawnHeart() {
    var area = document.getElementById("area");
    var heart = document.createElement("div");
    heart.className = "heart";

    var hearts = ["❤️", "💕", "💖", "💗", "🩷"];
    heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];

    var size = 55;
    var maxLeft = area.clientWidth - size;
    heart.style.left = Math.floor(Math.random() * maxLeft) + "px";
    heart.style.top = "-60px";

    // Плавное падение через CSS-переход
    area.appendChild(heart);

    // Небольшая задержка, чтобы браузер применил начальную позицию
    setTimeout(function() {
      heart.style.transition = "top 4.5s linear";
      heart.style.top = area.clientHeight + "px";
    }, 20);

    heart.onclick = function() {
      score = score + 1;
      heart.innerText = "💥";
      heart.style.transition = "none";
      heart.style.transform = "scale(1.5)";
      setTimeout(function() {
        if (heart.parentNode) heart.remove();
      }, 150);
    };

    // Убираем, когда упало
    setTimeout(function() {
      if (heart.parentNode) heart.remove();
    }, 4700);
  }

  function endGame() {
    running = false;
    clearInterval(spawnTimer);
    clearInterval(timeTimer);

    document.getElementById("btn").disabled = false;
    document.getElementById("btn").innerText = "Играть снова";
    document.getElementById("area").innerHTML = "";

    var text = "Игра окончена! Поймал " + score + " сердечек.";
    if (score >= 25) text += " Ты снайпер!";
    else if (score >= 15) text += " Отличный результат!";
    else if (score >= 8) text += " Хорошо, но можно лучше.";
    else text += " Попробуй ещё!";

    document.getElementById("score").innerText = text;
  }
</script>
</body>
</html>
