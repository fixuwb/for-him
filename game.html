<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сердечки</title>
<style>
  body { font-family: Arial; background: #ffe6f0; text-align: center; padding: 20px; }
  #area {
    position: relative;
    width: 600px; height: 400px;
    max-width: 95vw;
    margin: 20px auto;
    background: white;
    border: 2px solid #d6336c;
    border-radius: 15px;
    overflow: hidden;
  }
  .heart { position: absolute; font-size: 36px; cursor: pointer; user-select: none; }
  button { padding: 12px 28px; font-size: 18px; background: #d6336c; color: white; border: none; border-radius: 10px; cursor: pointer; }
  #score { font-size: 22px; color: #d6336c; margin: 15px; font-weight: bold; }
</style>
</head>
<body>
  <h1>Лови сердечки</h1>
  <button id="btn" onclick="start()">Начать игру</button>
  <div id="score">Счёт: 0</div>
  <div id="area"></div>

<script>
  var score = 0;
  var running = false;
  var spawnInt, timeInt, timeLeft = 15;

  function start() {
    score = 0;
    timeLeft = 15;
    running = true;
    document.getElementById("score").innerText = "Счёт: 0 | Осталось: 15";
    document.getElementById("btn").disabled = true;
    document.getElementById("btn").innerText = "Игра...";
    document.getElementById("area").innerHTML = "";

    spawnInt = setInterval(function() {
      if (running) spawn();
    }, 600);

    timeInt = setInterval(function() {
      timeLeft--;
      document.getElementById("score").innerText = "Счёт: " + score + " | Осталось: " + timeLeft;
      if (timeLeft <= 0) stop();
    }, 1000);
  }

  function spawn() {
    var area = document.getElementById("area");
    var h = document.createElement("div");
    h.className = "heart";
    h.innerText = "❤️";
    h.style.left = Math.random() * (area.clientWidth - 40) + "px";
    h.style.top = "-40px";
    h.onclick = function() {
      score++;
      document.getElementById("score").innerText = "Счёт: " + score + " | Осталось: " + timeLeft;
      h.remove();
    };
    area.appendChild(h);
    setTimeout(function() { if (h.parentNode) h.remove(); }, 3000);
  }

  function stop() {
    running = false;
    clearInterval(spawnInt);
    clearInterval(timeInt);
    document.getElementById("btn").disabled = false;
    document.getElementById("btn").innerText = "Играть снова";
    document.getElementById("area").innerHTML = "";
    alert("Игра окончена! Счёт: " + score);
  }
</script>
</body>
</html>
