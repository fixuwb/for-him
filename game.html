<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Лови сердечки 🩷</title>
<style>
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #e6f0ff, #ffe6f0);
    padding: 30px;
    color: #333;
    text-align: center;
    min-height: 100vh;
  }
  nav a {
    margin: 0 10px;
    color: #d6336c;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
  }
  nav a:hover { text-decoration: underline; }
  h1 { color: #d6336c; }
  .info {
    max-width: 500px;
    margin: 15px auto;
    font-size: 17px;
    color: #666;
  }
  #gameArea {
    position: relative;
    width: 100%;
    max-width: 600px;
    height: 400px;
    margin: 20px auto;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    overflow: hidden;
    cursor: crosshair;
  }
  .heart {
    position: absolute;
    font-size: 36px;
    user-select: none;
    cursor: pointer;
    animation: float 3s linear forwards;
  }
  .heart:hover { transform: scale(1.3); }
  @keyframes float {
    from { transform: translateY(0); }
    to { transform: translateY(420px); opacity: 0.3; }
  }
  .score-box {
    font-size: 22px;
    color: #d6336c;
    font-weight: bold;
    margin-top: 10px;
  }
  .btn {
    background: #d6336c;
    color: white;
    border: none;
    padding: 14px 30px;
    font-size: 17px;
    font-family: inherit;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn:hover { transform: scale(1.05); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <nav>
    <a href="index.html">Главная</a>
    <a href="quiz.html">Викторина</a>
    <a href="anniversary.html">Годовщина</a>
    <a href="plans.html">Планы</a>
    <a href="fun.html">Развлечения</a>
  </nav>

  <h1>🩷 Лови сердечки</h1>
  <p class="info">Нажимай на сердечки, пока они летят вниз. У тебя 15 секунд!</p>

  <button class="btn" id="startBtn" onclick="startGame()">Начать игру</button>
  <div class="score-box" id="score">Счёт: 0</div>
  <div id="gameArea"></div>
  <div class="info" id="result"></div>

<script>
  let score = 0;
  let gameRunning = false;
  let gameInterval;
  let timeLeft = 15;

  function startGame() {
    score = 0;
    timeLeft = 15;
    gameRunning = true;
    document.getElementById("score").innerText = "Счёт: 0";
    document.getElementById("result").innerText = "";
    document.getElementById("startBtn").disabled = true;
    document.getElementById("startBtn").innerText = "Игра идёт...";
    document.getElementById("gameArea").innerHTML = "";

    if (gameInterval) clearInterval(gameInterval);

    // Спавним сердечки
    gameInterval = setInterval(() => {
      if (!gameRunning) return;
      spawnHeart();
    }, 600);

    // Таймер обратного отсчёта
    const timer = setInterval(() => {
      timeLeft--;
      document.getElementById("score").innerText =
        "Счёт: " + score + " | Осталось: " + timeLeft + " сек";

      if (timeLeft <= 0) {
        clearInterval(timer);
        endGame();
      }
    }, 1000);
  }

  function spawnHeart() {
    const area = document.getElementById("gameArea");
    const heart = document.createElement("div");
    heart.className = "heart";
    const hearts = ["❤️", "💕", "💖", "💗", "🩷"];
    heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * (area.clientWidth - 45) + "px";
    heart.style.top = "-45px";

    heart.onclick = (e) => {
      e.stopPropagation();
      score++;
      heart.innerText = "💥";
      heart.style.transform = "scale(1.6)";
      setTimeout(() => heart.remove(), 200);
    };

    area.appendChild(heart);
    setTimeout(() => heart.remove(), 3000);
  }

  function endGame() {
    gameRunning = false;
    clearInterval(gameInterval);
    document.getElementById("startBtn").disabled = false;
    document.getElementById("startBtn").innerText = "Играть снова";

    let comment = "";
    if (score >= 25) comment = "Ты просто снайпер! 🎯💕";
    else if (score >= 15) comment = "Отличный результат! 🎉";
    else if (score >=) comment = "Хорошо! Но можно лучше 😏";
    else comment = "Попробуй ещё — сердечки ждут 💗";

    document.getElementById("result").innerHTML =
      "Игра окончена! Ты поймал <b>" + score + "</b> сердечек.
" + comme
  }
</script>
</body>
</html> 8
