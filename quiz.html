<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Викторина о нас 💕</title>
<style>
  body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #e6f0ff, #ffe6f0);
    padding: 30px;
    color: #333;
    text-align: center;
  }
  nav a {
    margin: 0 12px;
    color: #d6336c;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
  }
  nav a:hover { text-decoration: underline; }
  h1 { color: #d6336c; }
  .card {
    background: white;
    max-width: 600px;
    margin: 25px auto;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  .question {
    font-size: 20px;
    margin-bottom: 20px;
    color: #333;
  }
  .options button {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    font-size: 17px;
    font-family: inherit;
    background: #ffe6f0;
    border: 2px solid #d6336c;
    color: #d6336c;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.2s;
  }
  .options button:hover {
    background: #d6336c;
    color: white;
  }
  .options button:disabled {
    opacity: 0.85;
    cursor: default;
  }
  .feedback {
    margin-top: 15px;
    font-size: 17px;
    line-height: 1.5;
    color: #555;
    min-height: 30px;
  }
  .final {
    font-size: 20px;
    color: #d6336c;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <nav>
    <a href="index.html">Главная</a>
    <a href="quiz.html">Викторина</a>
    <a href="anniversary.html">Годовщина</a>
  </nav>

  <h1>Викторина о нас 💕</h1>
  <p>Проверим, как хорошо ты меня знаешь 😏</p>

  <div class="card" id="quiz"></div>

<script>
  // 👇 ВОПРОСЫ 👇
  const questions = [
    {
      q: "Как зовут моего пушина?",
      options: ["Кексик", "Киви", "Мармеладка"],
      correct: 0,
      comment: "Да! Кексик 🐈 Самый сладкий пушин на свете."
    },
    {
      q: "Что я больше всего люблю в тебе?",
      options: ["Внешность", "Характер", "Всё"],
      correct: 2,
      comment: "Конечно ВСЁ! Ты — мой человек целиком 💕"
    },
    {
      q: "Как называется любимое кафе, где мы пьём бабл ти?",
      options: ["Онегин", "Гости", "Рецепт"],
      correct: 1,
      comment: "Да, «Гости»! Там самое вкусное бабл ти 🧋"
    },
    {
      q: "Что я выберу?",
      options: ["Пицца с курицей", "Суп куриный", "Салатик"],
      correct: 0,
      comment: "Пицца с курицей! Ты меня знаешь 🍕"
    }
  ];

  let current = 0;
  let score = 0;

  function render() {
    const quiz = document.getElementById("quiz");

    if (current >= questions.length) {
      quiz.innerHTML = `
        <p class="final">
          Ты набрал ${score} из ${questions.length} 💕

 

 Но знаешь что? Неважно, сколько ты угадал.

     
 Важно то, что ты — мой человек, и я люблю тебя любым.

 

 Жду тебя. Возвращайся скорее ❤️
        </p>`;
      return;
    }

    const q = questions[current];

    let html = `<p class="question">${current + 1}. ${q.q}</p>`;
    html += `<div class="options">`;

    q.options.forEach((opt, i) => {
      html += `<button onclick="answer(${i})">${opt}</button>`;
    });

    html += `</div><div class="feedback" id="feedback"></div>`;

    quiz.innerHTML = html;
  }

  function answer(i) {
    const q = questions[current];
    const feedback = document.getElementById("feedback");
    const buttons = document.querySelectorAll(".options button");

    buttons.forEach(b => b.disabled = true);

    if (i === q.correct) {
      score++;
      feedback.innerHTML = "✅ " + q.comment;
      buttons[i].style.background = "#a8e6a8";
      buttons[i].style.color = "white";
    } else {
      feedback.innerHTML = "❌ Не угадал, но всё равно мило. " + q.comment;
      buttons[i].style.background = "#f5a8a8";
      buttons[i].style.color = "white";
      buttons[q.correct].style.background = "#a8e6a8";
      buttons[q.correct].style.color = "white";
    }

    setTimeout(() => {
      current++;
      render();
    }, 2500);
  }

  render();
</script>
</body>
</html>
